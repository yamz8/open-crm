name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Changelog must mention this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "## \[$TAG\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no entry for $TAG" >&2
            exit 1
          }

  image:
    name: Publish the container image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The published image must actually boot
        run: |
          docker run -d --name crm -p 4000:4000 \
            -e OPEN_CRM_SECRET=release-verification-only \
            ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}
          for i in $(seq 1 40); do
            curl -fsS http://localhost:4000/readyz && exit 0
            sleep 2
          done
          docker logs crm
          exit 1

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # Skipped on forks. Also a no-op until npm publishing is set up — see the
    # "Publishing to npm" section of CONTRIBUTING.md.
    if: ${{ github.repository_owner == 'yamz8' }}
    permissions:
      contents: read
      # Required by `npm publish --provenance`: the signed attestation is built
      # from a GitHub OIDC token. Without this the publish fails outright.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Draft the GitHub release
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pull this version's changelog section
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v tag="## \\[$TAG\\]" '
            $0 ~ tag {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: true
          generate_release_notes: true
