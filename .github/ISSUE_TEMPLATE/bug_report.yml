name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything security-related, please follow [SECURITY.md](../../SECURITY.md)
        instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I called POST /api/v1/deals with …
        I expected a 201; I got a 500.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The smallest thing that shows it — a curl command is ideal.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npm run cli -- version`, or the image tag.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: textarea
    id: selfcheck
    attributes:
      label: Self-check output
      description: '`npm run selfcheck` — often explains the problem outright.'
      render: shell
  - type: dropdown
    id: surface
    attributes:
      label: Where did you hit it
      multiple: true
      options: [REST API, MCP, Web UI, CLI, Docker]
